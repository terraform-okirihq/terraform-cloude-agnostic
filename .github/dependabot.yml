version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /
      - /modules/*
      - /examples/*
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
