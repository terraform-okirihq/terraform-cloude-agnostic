name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive -diff

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - .
          - modules/context
          - modules/aws
          - modules/azure
          - modules/gcp
          - examples/aws
          - examples/azure
          - examples/gcp
          - examples/workspaces
          - examples/hcp-terraform
          - examples/multi-cloud
          - examples/platform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - working-directory: ${{ matrix.dir }}
        run: |
          terraform init -backend=false -input=false
          terraform validate

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  test:
    # Mocked providers: no cloud credentials needed.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        terraform: ["1.9.8", "latest"] # minimum supported + newest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
      - run: terraform test

  # Single required status check for branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [fmt, validate, tflint, test]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed." && exit 1
          fi
