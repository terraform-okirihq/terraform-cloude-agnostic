# release-please keeps a "chore(main): release x.y.z" PR open that bumps the
# version and CHANGELOG from Conventional Commits. Merging it creates the
# vX.Y.Z tag + GitHub Release, which the Terraform Registry publishes.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
