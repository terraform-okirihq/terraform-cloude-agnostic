# Requires the RELEASE_PLEASE_TOKEN secret (fine-grained PAT or GitHub App
# token with Contents + Pull requests: read/write on this repo).
#
# release-please keeps a "chore(main): release x.y.z" PR open that bumps the
# version and CHANGELOG from Conventional Commits. Merging it creates the
# vX.Y.Z tag + GitHub Release, which the Terraform Registry publishes.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A dedicated token lets release PRs trigger CI (PRs opened with the
          # built-in GITHUB_TOKEN do not) and avoids needing the org setting
          # "Allow GitHub Actions to create and approve pull requests".
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
